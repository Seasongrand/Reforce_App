name: aulas-particulares

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aulas
      POSTGRES_PASSWORD: aulas
      POSTGRES_DB: aulas
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aulas -d aulas"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
